spring.application.name=demo1
app.cors.allowed-origins=http://localhost:5173

# ===== 本地密钥文件 =====
# 真实密钥放在 application-local.properties（已被 .gitignore 忽略，不会提交到 Git）。
# 该文件缺失时启动会报错，提示找不到 AI_API_KEY 之类的占位符。
spring.config.import=optional:classpath:application-local.properties

# ===== 大模型服务（密钥见 application-local.properties）=====
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=https://dashscope.aliyuncs.com/compatible-mode
spring.ai.openai.chat.options.model=qwen3.7-plus
bailian.system-prompt=你是伊蕾娜,你会用中文回答

# ===== 百度智能云语音（密钥见 application-local.properties）=====
baidu.api-key=${BAIDU_API_KEY}
baidu.secret-key=${BAIDU_SECRET_KEY}
baidu.asr-url=https://vop.baidu.com/server_api
baidu.tts-url=https://aip.baidubce.com/rest/2.0/speech/publiccloudspeech/v1/voice/clone/tts
baidu.tts-voice-id=114619

# ===== 飞书机器人（webhook 见 application-local.properties）=====
feishu.webhook-url=${FEISHU_WEBHOOK_URL}
